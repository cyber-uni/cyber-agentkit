runs: 3
threshold: 2
trigger:
  - { prompt: "Is my release-notes skill any good? Check it.", expect: fire }
  - { prompt: "Write a skill that drafts release notes from merged pull requests.", expect: fire }
  - { prompt: "My release-notes skill doesn't trigger when I ask for a changelog. Fix it.", expect: fire }
  - { prompt: "Run the evals for the release-notes skill.", expect: fire }
  - { prompt: "Which implementation does each skill-design aspect use? I may switch some.", expect: fire }
  - { prompt: "Is the skill in github.com/acme/skills safe to install? Vet it first.", expect: fire }
  # The work itself changes a skill, though the request does not ask about skills (#205).
  - { prompt: "Implement issue #42: the description in .agents/skills/release-notes/SKILL.md should also fire on 'changelog'. Open a PR when done.", expect: fire }
  - { prompt: "Work on issue #57: add a references/labels.md to the release-notes skill folder that lists how to group notes by label, and link it from its steps.", expect: fire }
  - { prompt: "Turn what we just did into a skill.", expect: skip }
  - { prompt: "Load our style reference and tell me what it says about tone.", expect: skip }
  - { prompt: "Add a rule to AGENTS.md that this repo uses pnpm.", expect: skip }
  - { prompt: "Review my diff before I push.", expect: skip }
  - { prompt: "Install the release-notes plugin from our marketplace.", expect: skip }
  # Near misses for #205: code that only reads skills, not a change to one.
  - { prompt: "Fix the bug in src/skill/parse.ts where front matter with a CRLF line ending is not read from a SKILL.md.", expect: skip }
  - { prompt: "Add a unit test for the function that lists the skills a plugin ships.", expect: skip }
  # A skill that ships inside a plugin or package, "add a skill", and a skill that teaches a library (#216).
  - { prompt: "Add an /axi skill to the agent plugin in our cli-kit npm package that teaches agents writing a CLI to follow our version of AXI.", expect: fire }
  - { prompt: "Add a skill to this plugin.", expect: fire }
  - { prompt: "Teach agents to use our date library: write a skill for it that ships with the npm package.", expect: fire }
  - { prompt: "Add a release-notes skill.", expect: fire }
  - { prompt: "Teach me how to use our date library's parse function.", expect: skip }
  - { prompt: "Add a hooks component to this plugin's plugin.json.", expect: skip }
# files/samples holds two sample skills (R79): release-notes passes every check; release-notes-flawed passes every
# script check but fails TRG-3 (its description says how it works), CRI-3 ("The notes are clear"), and SHP-3 (its
# grouping step is prose a script could do).
outcome:
  # check-passing and check-flawed ask for two closing lines, so a check reads the verdict, not the prose around it.
  - id: check-passing
    prompt: >-
      Check the skill in .agents/skills/release-notes. End your reply with two lines: "Failed:" then the IDs of the
      checks it fails, or "none"; and "Not checked:" then the IDs of the checks you could not decide, or "none".
    files: files/samples
    criteria: [C2, C3]
    checks:
      C2:
        - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
        - regex: "Not checked:[^\\n]*TRG-4"
      C3:
        - regex: "Failed:\\W{0,4}[Nn]one\\b"
  - id: check-flawed
    prompt: >-
      Check the skill in .agents/skills/release-notes-flawed. End your reply with two lines: "Failed:" then the IDs of
      the checks it fails, or "none"; and "Not checked:" then the IDs of the checks you could not decide, or "none".
    files: files/samples
    criteria: [C2, C3]
    checks:
      C2:
        - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
        - regex: "Not checked:[^\\n]*TRG-4"
      C3:
        - regex: "Failed:[^\\n]*TRG-3"
        - regex: "Failed:[^\\n]*CRI-3"
        - regex: "Failed:[^\\n]*SHP-3"
  # A name, not a path: /skill looks it up in the repository's and the user's skills folders, and says so. Without
  # "with /skill" the request does not call the skill.
  - id: check-missing
    prompt: Check the deploy-notes skill with /skill.
    files: files/samples
    criteria: [C1, C2]
  - id: create-existing
    prompt: Create a skill named release-notes in .agents/skills that writes release notes from merged pull requests.
    files: files/samples
    criteria: [C4]
  # create-ask asks to approve each draft, so the author sets ask. Every other case runs the same way whoever asks: the
  # leash (the level and the test budget in skill-design.autonomy) decides where it stops (#214).
  - id: create-ask
    prompt: >-
      Create a skill in .agents/skills that drafts a changelog entry for each merged pull request. Show me each
      draft and wait for my approval before you write anything.
    files: files/samples
    criteria: [C5, C13]
    checks:
      C13:
        - regex: "[Aa]utonomy:\\W{0,4}ask\\b"
  # A description with no command routes to create, which runs check and then test without asking, since
  # files/high-budget sets a budget no test reaches. The sandbox has no network, so the test itself cannot complete.
  - id: create-described
    prompt: >-
      /skill a skill in .agents/skills that drafts a changelog entry for each merged pull request. I approve every
      draft; don't ask again. End your reply with a line "Check:" then pass or fail, from the check of the skill you
      wrote.
    files: files/high-budget
    criteria: [C11, C16]
  # Other work adds a skill (#205): the work is the approval, so the skill is written without asking about each aspect.
  - id: work-adds-skill
    prompt: >-
      Implement issue #61: add a changelog-entry skill in .agents/skills that drafts a changelog entry for each merged
      pull request. Report what you did when done.
    files: files/samples
    criteria: [C12]
  # files/low-budget sets a budget of $0.01 or 1 run, so the test of the new skill is over it: the run keeps the skill,
  # starts no test run, and ends by asking.
  - id: create-over-budget
    prompt: >-
      Implement issue #61: with /skill, create a skill in .agents/skills that drafts a changelog entry for each merged
      pull request, then report what you did.
    files: files/low-budget
    criteria: [C13, C14, C16]
    checks:
      C13:
        - regex: "[Aa]utonomy:\\W{0,4}apply(-safe)?\\b"
  # The work names a change to the skill's Intent, which only the author decides: the run stops and asks.
  - id: enhance-intent
    prompt: >-
      Implement issue #64: with /skill, enhance the skill in .agents/skills/release-notes so it writes the notes from
      git tags instead of merged pull requests, then report what you did.
    files: files/samples
    criteria: [C15, C16]
  - id: fix-flawed
    prompt: >-
      Check the skill in .agents/skills/release-notes-flawed, then fix what the check finds. I approve every change;
      don't ask again.
    files: files/samples
    criteria: [C6, C7]
  - id: help
    prompt: I want to create, check, test, or fix an agent skill. Which commands can I use? List them all.
    files: files/samples
    criteria: [C8]
  - id: customize-show
    prompt: Show me which implementation each aspect of /skill uses. Don't change anything yet.
    files: files/samples
    criteria: [C9]
  - id: vet-public
    prompt: >-
      Vet the find-skills skill in github.com/vercel-labs/skills before I install it. Don't install it. End your reply
      with a line "Verdict:" then blocked or not blocked.
    files: files/samples
    network: [github.com, api.github.com, codeload.github.com, skills.sh]
    criteria: [C10]
rubrics:
  C1:
    - regex: "deploy-notes"
    - regex: "~/\\.[a-z]+/skills|\\$HOME/\\.[a-z]+/skills|[Uu]ser'?s? (own )?skills"
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C2:
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C4:
    - regex: "check"
    - regex: "fix"
    - regex: "enhance"
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C5:
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C6:
    - script: >-
        f=.agents/skills/release-notes-flawed/SKILL.md;
        ! grep -q 'The notes are clear' $f
        && ! awk 'NR>1 && /^---$/{exit} NR>1' $f | grep -qE 'prs\.json|RELEASE_NOTES'
        && grep -qE 'scripts/[A-Za-z0-9_-]+\.(mjs|js|cjs|sh|py)' $f
  C7:
    - contains: TRG-3
    - contains: CRI-3
    - contains: SHP-3
    - script: >-
        test -z "$(git status --porcelain --untracked-files=all | grep -v ' .agents/skills/release-notes-flawed/')"
        && git diff --quiet HEAD -- .agents/skills/release-notes-flawed/README.md
  C8:
    - regex: "\\bcreate\\b"
    - regex: "\\bcheck\\b"
    - regex: "\\btest\\b"
    - regex: "\\bfix\\b"
    - regex: "\\benhance\\b"
    - regex: "\\bcustomize\\b"
    - regex: "\\bvet\\b"
    - regex: "skillify"
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C9:
    - regex: "[Cc]riteria"
    - regex: "[Vv]erification"
    - regex: "[Ss]ecurity"
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C13:
    - regex: "[Aa]utonomy:\\W{0,4}(ask|apply-safe|apply)\\b"
  C14:
    - script: >-
        f=$(ls .agents/skills/*/SKILL.md) && test -n "$f" && grep -q '^## Done when' $f
        && test ! -e .agents/skill-design/results
    - regex: "Test budget:\\W{0,4}over"
    - regex: "\\b\\d+ runs\\b"
    - regex: "\\?"
  C15:
    - regex: "[Ii]ntent|[Pp]urpose|what (the skill|it) is for"
    - regex: "\\?"
    - script: "git diff --quiet HEAD -- .agents/skills/release-notes && test -z \"$(git status --porcelain --untracked-files=all -- .agents/skills/release-notes)\""
  C16:
    - not-regex: "[Nn]o (author|one|human) (is )?(present|watching|available)|[Uu]nattended|[Nn]obody (is )?(present|watching|available)"
  C10:
    - regex: "Verdict:\\W{0,4}(blocked|not blocked)"
    - not-regex: "[Ss]tars?[^\\n]{0,40}[Ii]nstalls|[Ii]nstalls[^\\n]{0,40}[Ss]tars?"
    - script: >-
        test -z "$(git status --porcelain --untracked-files=all)"
        && test -z "$(ls -d "${TMPDIR:-/tmp}"/cyber-agentkit-vet-* 2>/dev/null)"
  C11:
    - script: "ls .agents/skills/*/SKILL.md | grep -qv release-notes"
    - regex: "Check:\\W{0,4}(pass|fail)"
    - regex: "Test budget:\\W{0,4}within"
    - not-regex: "\\?\\s*$"
  # create writes the skill's evals; without the skill the work writes a SKILL.md alone.
  C12:
    - script: "test -f .agents/skills/changelog-entry/SKILL.md && test -f .agents/skills/changelog-entry/evals/evals.yaml"
    - regex: "\\bcheck\\b"
