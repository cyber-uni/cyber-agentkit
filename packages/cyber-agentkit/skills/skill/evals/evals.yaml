runs: 3
threshold: 2
trigger:
  - { id: fire-check, prompt: 'Is my release-notes skill any good? Check it.', expect: fire }
  - { id: fire-create, prompt: 'Write a skill that drafts release notes from merged pull requests.', expect: fire }
  - {
      id: fire-fix-trigger,
      prompt: "My release-notes skill doesn't trigger when I ask for a changelog. Fix it.",
      expect: fire,
    }
  - { id: fire-test, prompt: 'Run the evals for the release-notes skill.', expect: fire }
  - {
      id: fire-customize,
      prompt: 'Which implementation does each skill-design aspect use? I may switch some.',
      expect: fire,
    }
  - { id: fire-vet, prompt: 'Is the skill in github.com/acme/skills safe to install? Vet it first.', expect: fire }
  - {
      id: fire-doctor-overrides,
      prompt: 'Our issue skill breaks partway through in this repo. Do its references still work with our overrides?',
      expect: fire,
    }
  # The work itself changes a skill, though the request does not ask about skills (#205).
  - {
      id: fire-issue-edits-description,
      prompt: "Implement issue #42: the description in .agents/skills/release-notes/SKILL.md should also fire on 'changelog'. Open a PR when done.",
      expect: fire,
    }
  - {
      id: fire-issue-adds-reference,
      prompt: 'Work on issue #57: add a references/labels.md to the release-notes skill folder that lists how to group notes by label, and link it from its steps.',
      expect: fire,
    }
  - { id: fire-report, prompt: 'Publish the eval results of the release-notes skill on its docs page.', expect: fire }
  - { id: skip-skillify, prompt: 'Turn what we just did into a skill.', expect: skip }
  - { id: skip-load-reference, prompt: 'Load our style reference and tell me what it says about tone.', expect: skip }
  - { id: skip-agents-md-rule, prompt: 'Add a rule to AGENTS.md that this repo uses pnpm.', expect: skip }
  - { id: skip-review-diff, prompt: 'Review my diff before I push.', expect: skip }
  - { id: skip-install-plugin, prompt: 'Install the release-notes plugin from our marketplace.', expect: skip }
  # Near misses for #205: code that only reads skills, not a change to one.
  - {
      id: skip-fix-parser-bug,
      prompt: 'Fix the bug in src/skill/parse.ts where front matter with a CRLF line ending is not read from a SKILL.md.',
      expect: skip,
    }
  - {
      id: skip-unit-test,
      prompt: 'Add a unit test for the function that lists the skills a plugin ships.',
      expect: skip,
    }
  # A skill that ships inside a plugin or package, "add a skill", and a skill that teaches a library (#216).
  - {
      id: fire-create-in-npm-plugin,
      prompt: 'Add an /axi skill to the agent plugin in our cli-kit npm package that teaches agents writing a CLI to follow our version of AXI.',
      expect: fire,
    }
  - { id: fire-add-to-plugin, prompt: 'Add a skill to this plugin.', expect: fire }
  - {
      id: fire-teach-library,
      prompt: 'Teach agents to use our date library: write a skill for it that ships with the npm package.',
      expect: fire,
    }
  - { id: fire-add-skill, prompt: 'Add a release-notes skill.', expect: fire }
  - { id: skip-teach-me-library, prompt: "Teach me how to use our date library's parse function.", expect: skip }
  - { id: skip-add-hooks-component, prompt: "Add a hooks component to this plugin's plugin.json.", expect: skip }
  # doctor across every harness on this machine, not only the running one.
  - {
      id: fire-doctor-all-harnesses,
      prompt: 'Do the references our triage skill loads work in Codex too, not only here? Check it for every harness installed on this machine.',
      expect: fire,
    }
# files/samples holds two sample skills (R79): release-notes passes every check; release-notes-flawed passes every
# critical script check but fails TRG-3 (its description says how it works), CRI-3 ("The notes are clear"), SHP-3 (its
# grouping step is prose a script could do), and the VER-12 warning (its setup writes .git/hooks and repository git
# config, #294).
outcome:
  # Other work adds a skill (#205): the work is the approval, so the skill is written without asking about each aspect.
  # Its job is one no skill in files/samples covers, so research finds nothing to adopt and does not stop the run.
  # Like create-described, it cannot complete a nested `skill test` in the sandbox, and C12 does not rely on one (#285).
  - id: work-adds-skill
    prompt: >-
      Implement issue #61: add an oncall-handoff skill in .agents/skills that drafts this team's weekly on-call handoff
      note from incidents.json, a list of incidents each with an id, title, severity, and status (open or resolved).
      Report what you did when done.
    files: files/samples
    criteria: [C12]
  # A case that needs git history gets a setup script through `skill case add --setup`, not a setup step in its
  # prompt (#251). The script's header is the one `skill case` writes, so a script written by hand does not pass. The
  # baseline passes too: it loads the plugin without this skill, and the plugin's Verification reference and its
  # bin/ CLI teach and run `skill case` on their own, so the case is a guard (#255). Against the skill before #253's
  # change it passed 3 of 3 with the skill and 0 of 3 without.
  - id: case-with-history
    prompt: >-
      Add an eval case named squash-merge to the skill in .agents/skills/release-notes. Each run should start from a
      repository with a start commit and an uncommitted change to CHANGELOG.md, and the request is "Write the release
      notes." I approve writing it; don't ask again, and don't run the test.
    files: files/samples
    guard: true
    criteria: [C21]
# The spec criteria each rubric tests, in the skill-design spec and its children. A rubric checks the outcome those
# criteria state; for a stop, the Stop outcome of the spec's decision graph (R167) on edge E1, E2, or E3.
#   C1 R1 | C2 R18, R21 | C3 R17, R19 | C4 R7 | C5 R6 (E1) | C6 R39 | C7 R37, R38 | C8 R94, R96 | C9 R92, R93
#   C10 R142 to R147, R149 | C11 R5, R166 (E4) | C12 none yet | C13 R150 | C14 R166, R167 (E2)
#   C15 R74, R167 (E3) | C16 R150, R167 (E1 to E3) | C17 R152, R153 (E3) | C18 none yet | C19 R154 | C20 none yet
#   C21 R155, R159 | C23 R168 | C24 R168 | C25 none yet | C26 #323 | C28 R169, R170
#   C29 R187 | C30 R188, R189 | C31 R184
rubrics:
  C1:
    - regex: 'deploy-notes'
    # The user skills folder in any form a reply writes it: `~/`, `$HOME/`, the run's absolute home folder, or in words.
    - regex: "~/\\.[a-z]+/skills|\\$HOME/\\.[a-z]+/skills|[Hh]ome[\\w./-]*/\\.[a-z]+/skills|[Hh]ome (folder|directory)|[Uu]ser'?s?[ -](own |level |-level )?skills"
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C2:
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C4:
    - regex: 'check'
    - regex: 'fix'
    - regex: 'enhance'
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C5:
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C6:
    - script: >-
        f=.agents/skills/release-notes-flawed/SKILL.md;
        ! grep -q 'The notes are clear' $f
        && ! awk 'NR>1 && /^---$/{exit} NR>1' $f | grep -qE 'prs\.json|RELEASE_NOTES'
        && grep -qE 'scripts/[A-Za-z0-9_-]+\.(mjs|js|cjs|sh|py)' $f
  C7:
    - contains: TRG-3
    # The criteria fault by its ID, or in words: the criterion it names, or C5 called a Criteria fault (#238).
    - regex: "CRI-3|[Nn]otes are clear|\\bC5\\b\\W{0,4}\\(?Criteria"
    - contains: SHP-3
    - script: >-
        test -z "$(git status --porcelain --untracked-files=all | grep -v ' .agents/skills/release-notes-flawed/')"
        && git diff --quiet HEAD -- .agents/skills/release-notes-flawed/README.md
  C8:
    - regex: "\\bcreate\\b"
    - regex: "\\bcheck\\b"
    - regex: "\\btest\\b"
    - regex: "\\bfix\\b"
    - regex: "\\benhance\\b"
    - regex: "\\bcustomize\\b"
    - regex: "\\bvet\\b"
    - regex: "\\breport\\b"
    - regex: 'skillify'
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C9:
    - regex: '[Cc]riteria'
    - regex: '[Vv]erification'
    - regex: '[Ss]ecurity'
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  C13:
    - regex: "[Aa]utonomy:\\W{0,4}(ask|apply-safe|apply)\\b"
  C14:
    # A test run saves latest.json under the results folder. `skill case try` keeps a try/ folder there, but starts no
    # test run, so the folder alone is no sign of one.
    - script: >-
        f=$(ls .agents/skills/*/SKILL.md) && test -n "$f" && grep -q '^## Done when' $f
        && test -z "$(find .agents/skill-design/results -name latest.json 2>/dev/null)"
    # The budget line in any case or markup, such as `Test budget: over` or **`test` budget:** over.
    - regex: "[Tt]est\\W{0,4}[Bb]udget\\W{0,6}over\\b"
    - regex: "\\b\\d+ runs\\b"
    # A stop ends with a question or with options lettered A, B, and so on (#264), in any markup, such as **A:**, **A.**,
    # or A); the scripts check it stopped.
    - regex: "\\?|(^|\\n)[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Aa](\\*\\*)?[.):][\\s\\S]*\\n[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Bb](\\*\\*)?[.):]"
  C15:
    - regex: '[Ii]ntent|[Pp]urpose|what (the skill|it) is for'
    - regex: "\\?|(^|\\n)[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Aa](\\*\\*)?[.):][\\s\\S]*\\n[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Bb](\\*\\*)?[.):]"
    - script: 'git diff --quiet HEAD -- .agents/skills/release-notes && test -z "$(git status --porcelain --untracked-files=all -- .agents/skills/release-notes)"'
  C16:
    - not-regex: '[Nn]o (author|one|human) (is )?(present|watching|available)|[Uu]nattended|[Nn]obody (is )?(present|watching|available)'
  C10:
    - regex: "Verdict:\\W{0,4}(blocked|not blocked)"
    - not-regex: "[Ss]tars?[^\\n]{0,40}[Ii]nstalls|[Ii]nstalls[^\\n]{0,40}[Ss]tars?"
    - script: >-
        test -z "$(git status --porcelain --untracked-files=all)"
        && test -z "$(ls -d "${TMPDIR:-/tmp}"/cyber-agentkit-vet-* 2>/dev/null)"
  C11:
    - script: 'ls .agents/skills/*/SKILL.md | grep -qv release-notes'
    - regex: "Check:\\W{0,4}(pass|fail)"
    - regex: "[Tt]est\\W{0,4}[Bb]udget\\W{0,6}within\\b"
    # Started without asking: the reply does not end as a stop does, with a question or lettered options.
    - not-regex: "(\\?|\\n[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[B-Hb-h][.):][^\\n]*)\\s*$"
  # create writes the skill's evals and README's Research section, and reports `check`'s result. Without the skill,
  # the work may copy release-notes' layout, but it reports only its own checks ("all four checks passed").
  C12:
    - script: 'test -f .agents/skills/oncall-handoff/SKILL.md && test -f .agents/skills/oncall-handoff/evals/evals.yaml'
    - script: "grep -q '^## Research' .agents/skills/oncall-handoff/README.md"
    - regex: "`(skill )?check`|\\bskill(\\.mjs)? check\\b|\\b(static|automatic) checks?\\b"
  C17:
    - regex: '[Rr]esearch'
  C21:
    - script: >-
        d=.agents/skills/release-notes/evals; f=$d/evals.yaml;
        grep -q 'squash-merge' $f && grep -qE 'setup: *setup/squash-merge\.sh' $f
        && grep -q 'The setup of case squash-merge' $d/setup/squash-merge.sh && grep -q 'CHANGELOG' $d/setup/squash-merge.sh
        && ! grep -iqE '(run|execute).{0,40}[.]sh' $f
        && git diff --quiet HEAD -- $d/files .agents/skills/release-notes-flawed
  C19:
    # Each wording check accepts the ways of saying it: "sandbox failures", "the sandbox broke one run"; "not
    # counted", "uncounted", "neither is counted" (#264, #271).
    - regex: "[Ss]andbox\\b[^\\n]{0,60}\\b([Ff]ail|[Ff]ault|[Bb]roke|[Ll]ost|[Ee]rror)|([Ff]ail|[Ff]ault|[Bb]roke|[Ll]ost|[Ee]rror)[^\\n]{0,60}\\b[Ss]andbox"
    - regex: "[Nn]o pass rate|\\b[Uu]ncounted\\b|\\b([Nn]either|[Nn]one|[Nn]or)( of them)? (is|was|were|are|gets?|got) counted|(not|n't|never)( be| been| being| get| got)? (counted|included|scored)|(doesn't|does not|don't|do not|didn't|did not|never|aren't|weren't) count\\b|count(s|ed)? (toward|against) (no|none)|excluded|left out"
    # Not saved, in the words runs use for it: not saved or accepted, held, or on hold (#264).
    - regex: "(not|n't)( been| yet| yet been)? (saved|accepted)|\\bheld\\b|\\bon hold\\b"
    - regex: "skill(\\.mjs)? accept\\b"
    # No `fix`: none ran, and the reply offers none. Advice against it, such as "Don't run `fix`", is not an offer.
    - script: '! grep -E ''"skill":"(cyber-agentkit:)?skill"'' .skill-test/skill-calls.jsonl 2>/dev/null | grep -qE ''"args":" *fix'''
    - not-regex: "([Ww]ant me to|[Ss]hall I|[Ss]hould I|I can|I could|I'll|[Ll]et me|[Oo]ffer to)( now)?( run| use| try)? `?/?(skill )?fix\\b|(^|\\n)[ \\t]*(\\d+[.)]|[-*])?[ \\t]*(\\*\\*)?([Rr]un|[Uu]se|[Tt]ry) `?/?(skill )?fix\\b"
    - script: 'test ! -e .agents/skills/release-notes/evals/expected.json && test -z "$(git status --porcelain --untracked-files=all)"'
  C20:
    - script: >-
        f=.agents/skills/release-notes/README.md;
        grep -qF 'with the skill, 12 of 12 criterion checks pass; without it, 4 of 12.' $f
        && grep -qF '| Draft the changelog for 2.0 from the merged PRs. | fire | 3 of 3 | pass |' $f
        && grep -q '^## Research' $f
    - script: 'test -z "$(git status --porcelain --untracked-files=all | grep -v '' .agents/skills/release-notes/README.md$'')"'
  C23:
    # Says the sandbox could not start, in its words or the error's.
    - regex: "[Ss]andbox[^\\n]{0,80}\\b(start|run|unavailable|available|work)|(start|run|unavailable)[^\\n]{0,60}\\b[Ss]andbox"
    # Offers the folder-only template, by its option or its reference.
    - regex: "--sandbox[ =]folder-only|skill-design\\.test\\.sandbox\\.folder-only"
    # Asks: a question, or lettered options.
    - regex: "\\?|(^|\\n)[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Aa](\\*\\*)?[.):][\\s\\S]*\\n[ \\t]*([-*][ \\t]+)?(\\*\\*)?\\(?[Bb](\\*\\*)?[.):]"
    # Takes none itself: no result saved and no override written.
    - script: 'test ! -e .agents/skill-design/results/release-notes/latest.json && test -z "$(git status --porcelain --untracked-files=all)"'
  C24:
    # Says the runs had no sandbox, before any pass rate (a count such as "3 of 3", or a percentage).
    # Accepts the ways runs say it: "no sandbox", "neither ... sandbox", "**Sandbox:** `none`", "the sandbox was `none`",
    # "the sandbox didn't run", "unsandboxed" (first test run of #302).
    - regex: "^((?!\\d+ ?(of|/) ?\\d+|\\d+ ?%)[\\s\\S])*?(\\b[Nn]o (OS |script )?sandbox|\\b[Nn]either[^\\n]{0,60}sandbox|without (a |any |the )?(OS |script )?sandbox|[Ss]andbox[*:`'\" ]{1,8}none\\b|[Ss]andbox (was|is) `?none\\b|[Ss]andbox (didn't|did not|wasn't|was not|never) (run|on|used)|[Uu]nsandboxed|\\bno isolation)"
    # Names each path written outside the run folder.
    - regex: "/home/dev/\\.config/release-notes/cache\\.json"
    - regex: "/tmp/release-notes-draft\\.md"
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
  # `update` and `fix` end with both results: the check, and either the test or the budget line that says why it did not run.
  # A nested `skill test` cannot complete in the sandbox, so the budget line or a test result is what the reply shows.
  C25:
    - regex: '[Cc]heck'
    - regex: 'Test budget:|[Tt]est (result|ran|passed|failed)|criteri(on|a)'
  # update tests the stale cases only, never every case, and its report names the scope that ran (R189).
  C30:
    - not-regex: "--all\\b"
    - regex: "\\bwrite\\b[^\\n]{0,80}\\b(scope|stale)|\\b(scope|stale)[^\\n]{0,80}\\bwrite\\b"
  # The repository's override of triage.rules repeats a heading, so it fails composing; doctor names it and says what
  # to do, and changes nothing (#340).
  C28:
    - regex: "triage\\.rules"
    - regex: "\\.agents/references/triage\\.rules\\.md"
    - regex: 'reference (customize|delete)|heading'
    - script: 'test -z "$(git status --porcelain --untracked-files=all)"'
