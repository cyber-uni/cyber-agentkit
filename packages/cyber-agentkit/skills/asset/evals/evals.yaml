runs: 3
threshold: 2
trigger:
  - { prompt: "Which files are in the release-notes skill's assets folder?", expect: fire }
  - { prompt: "Add a JSON schema at assets/schema.json to the release-notes skill.", expect: fire }
  - { prompt: "Delete the old template from the release-notes skill's assets.", expect: fire }
  - { prompt: "Override the release-notes template asset for this project with our own copy.", expect: fire }
  - { prompt: "Load our style reference and tell me what it says about tone.", expect: skip }
  - { prompt: "Write a skill that drafts release notes from merged pull requests.", expect: skip }
  - { prompt: "Move the steps in the release-notes skill into a references file.", expect: skip }
  - { prompt: "Add a logo image to the docs site's public folder.", expect: skip }
outcome:
  - id: show-text
    prompt: Show me the release-notes skill's assets/template.md.
    files: files/repo   # a repo skill with assets/template.md and a binary assets/logo.png
    criteria: [C1, C4]
    checks:
      C4:
        - contains: List each change as
  - id: show-binary
    prompt: Show me the content of the release-notes skill's assets/logo.png.
    files: files/repo
    criteria: [C1, C4, C5]
    checks:
      C4:
        - contains: logo.png
        - not-contains: IHDR
      C5:
        - contains: binary
  - id: create-approved
    prompt: >-
      Add assets/checklist.md to the release-notes skill, saying "- Tag the release." I approve writing it; don't ask
      again.
    files: files/repo
    criteria: [C1, C2, C3]
    checks:
      C2:
        - contains: checklist.md
      C3:
        - file-contains: { path: .agents/skills/release-notes/assets/checklist.md, text: "- Tag the release." }
  - id: create-existing
    prompt: >-
      Create assets/template.md in the release-notes skill, saying "## Notes". I approve writing it; don't ask again.
    files: files/repo
    criteria: [C1, C3, C5]
    checks:
      C3:
        - file-contains: { path: .agents/skills/release-notes/assets/template.md, text: List each change as }
      C5:
        - contains: exists
  - id: delete-unapproved
    prompt: Delete the release-notes skill's assets/template.md.
    files: files/repo
    criteria: [C2]
    checks:
      C2:
        - file-exists: .agents/skills/release-notes/assets/template.md
  - id: path-outside
    prompt: >-
      Add an asset at ../NOTES.md in the release-notes skill, saying "draft". I approve writing it; don't ask again.
    files: files/repo
    criteria: [C1, C5]
    checks:
      C5:
        - contains: path-invalid
        - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  - id: list
    prompt: Which files are in the release-notes skill's assets folder?
    files: files/repo
    criteria: [C1, C7]
  - id: delete-approved
    prompt: Delete the release-notes skill's assets/logo.png. I approve deleting it; don't ask again.
    files: files/repo
    criteria: [C1, C2, C8]
    checks:
      C2:
        - contains: logo.png
  - id: copy-managed
    prompt: >-
      Copy the managed tier's release-notes template into this project's assets so I can edit it. I approve writing
      it; don't ask again.
    files: files/repo
    criteria: [C1, C6]
rubrics:
  C7:
    - contains: template.md
    - contains: logo.png
  C8:
    - script: "test ! -e .agents/skills/release-notes/assets/logo.png && test -f .agents/skills/release-notes/assets/template.md"
  C1:
    - script: "test -z \"$(git status --porcelain --untracked-files=all | grep -vE ' \\.agents/(skills/release-notes/)?assets/')\""
  C2:
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C3:
    - file-exists: .agents/skills/release-notes/assets/template.md
  C4:
    - contains: List each change as
  C5:
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
  C6:
    - contains: load
    - script: "test -z \"$(git status --porcelain --untracked-files=all)\""
