runs: 3
threshold: 2
trigger:
  - {
      id: load-our-style-reference-and,
      prompt: 'Load our style reference and tell me what it says about tone.',
      expect: fire,
    }
  - { id: which-references-do-we-have, prompt: 'Which references do we have about testing?', expect: fire }
  - {
      id: make-the-repos-commit-message,
      prompt: "Make the repo's commit.message reference say we write in the present tense.",
      expect: fire,
    }
  - {
      id: why-does-the-style-reference,
      prompt: 'Why does the style reference come from my user folder and not the repo one?',
      expect: fire,
    }
  - {
      id: is-a-system-already-registered,
      prompt: 'Before I write a capability reference for Linear, is one already in the registry?',
      expect: fire,
    }
  - {
      id: write-a-skill-that-drafts,
      prompt: 'Write a skill that drafts release notes from merged pull requests.',
      expect: skip,
    }
  - { id: add-a-rule-to-agents, prompt: 'Add a rule to AGENTS.md that this repo uses pnpm.', expect: skip }
  - {
      id: my-release-notes-skill-doesnt,
      prompt: "My release-notes skill doesn't trigger when I ask for a changelog. Fix it.",
      expect: skip,
    }
  - {
      id: add-a-references-section-at,
      prompt: 'Add a References section at the end of docs/design.md linking the two papers we cite.',
      expect: skip,
    }
  - id: doctor-gitlab-fire
    prompt: Does our self-hosted GitLab still match what gitlab.capabilities says?
      Run the doctor on it.
    expect: fire
outcome:
  - id: find-none
    prompt: Is there a reference about deploy checklists?
    files: files/repo
    criteria: [C6]
    checks:
      C6:
        - regex: "\\b([Nn]o|[Nn]ot|[Nn]one|[Nn]othing|[Ee]mpty|0 match(es)?)\\b|n't\\b"
  - id: implement-interface
    prompt: >-
      Create a repo reference that implements the review.checklist interface, saying reviewers
      check the tests first. I approve writing it; don't ask again.
    files: files/repo-with-interface # adds .agents/references/review.checklist.interface.md
    criteria: [C1, C5]
rubrics:
  C1:
    - script: 'test -z "$(git status --porcelain --untracked-files=all | grep -v '' .agents/references/'')"'
  # Each run loads a copy of the plugin of its own, at $SKILL_TEST_PLUGIN, committed in git: C2 fails when the run changed it.
  C2:
    - script: 'test -z "$(git -C "$SKILL_TEST_PLUGIN" status --porcelain --untracked-files=all)"'
  C3:
    - regex: "\\.agents/references/[a-z.-]+\\.md"
  C4:
    - script: 'node "$SKILL_TEST_PLUGIN/skills/reference/scripts/reference.mjs" load deploy-checklist --trace 2>&1 | grep -q used'
  C5:
    - script: 'node "$SKILL_TEST_PLUGIN/skills/reference/scripts/reference.mjs" check review.checklist'
