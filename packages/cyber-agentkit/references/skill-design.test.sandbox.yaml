# How `skill test` and `skill case try` contain each run. With no file of this name in a managed, repo, or user
# references folder (`.agents/references/`, `~/.agents/references/`, or the managed one), runs take the
# `skill-design.test.sandbox.claude-code` template. To choose another, or to change one setting of a template, put a
# YAML file of this name in that tier's folder holding only the settings you change, and name the template in its
# metadata file, `skill-design.test.sandbox.meta.md`:
#
#   ---
#   extends: [cyber-agentkit/skill-design.test.sandbox.folder-only]
#   ---
#
# or pick one for one run with `skill test --sandbox folder-only`. The plugin ships two templates:
#   skill-design.test.sandbox.claude-code   Claude Code's OS sandbox and the script sandbox (the default)
#   skill-design.test.sandbox.folder-only   no sandbox, for a machine that cannot run one
#
# A mapping merges key by key over the template, a list replaces it whole, and `null` removes a key. Only the managed,
# repo, and user tiers and --sandbox choose or change these settings; another plugin's copy, or a skill's own, never
# answers on its own, but a file in those tiers may name a template another plugin ships as `<plugin>/<reference>`.
# An unknown key or a bad value stops the test before any run.
