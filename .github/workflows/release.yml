name: release
on:
  push:
    branches: [main]

permissions: {}

jobs:
  code:
    uses: cyber-uni/.github/.github/workflows/pnpm-verify.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      os: '["ubuntu-latest"]'
      playwright-browsers: ''

  # npm trusted publishing names this file, release.yml. Keep the filename.
  release:
    needs: code
    uses: cyber-uni/.github/.github/workflows/pnpm-release.yml@v1
    permissions:
      contents: write
      pull-requests: write
      id-token: write
