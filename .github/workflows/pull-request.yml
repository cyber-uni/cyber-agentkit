name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

permissions: {}

jobs:
  code:
    uses: cyber-uni/.github/.github/workflows/pnpm-verify.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      os: '["ubuntu-latest"]'
      playwright-browsers: ''

  # skill test kills a run that passes its time limit, with every process it started. The kill differs per
  # platform (Linux reads /proc, macOS asks ps, Windows kills the process tree), so its test runs on each.
  timeout-kill:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/skill-design/promptfoo-provider-source.test.ts -t "time limit"
        working-directory: packages/cyber-agentkit

  # The prebuilt skill scripts must rebuild byte for byte on every platform and Node version a
  # contributor builds on, or the drift check in `pnpm verify` would flag a correct commit.
  # `code` runs it on Linux; this runs it on the rest.
  plugin-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: ['lts/-1', 'lts/*']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm plugin:check
